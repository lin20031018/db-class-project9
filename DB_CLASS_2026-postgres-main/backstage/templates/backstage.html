<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園場館借用系統｜{% block title %}管理員後台{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/weblogo.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/backstage.css') }}">
</head>
<body>
    <header class="campus-header">
        <h1><a href="{{ url_for('analysis.dashboard') }}">校園場館管理後台</a></h1>
        <div class="header-account">
            <span>管理員 {{ current_user.name }}</span>
            <a class="logout" href="{{ url_for('api.logout') }}">登出</a>
        </div>
    </header>
    <nav class="campus-nav" aria-label="管理導覽">
        <div class="nav-inner">
            <a class="{{ 'active' if request.endpoint == 'analysis.dashboard' }}"
               href="{{ url_for('analysis.dashboard') }}">預約儀表板</a>
            <a class="{{ 'active' if request.endpoint and request.endpoint.startswith('manager.reservation') and request.args.get('status') != 'pending' }}"
               href="{{ url_for('manager.reservation_list') }}">預約管理</a>
            <a class="{{ 'active' if request.endpoint == 'manager.reservation_list' and request.args.get('status') == 'pending' }}"
               href="{{ url_for('manager.reservation_list', status='pending') }}">待審核申請</a>
            <a class="{{ 'active' if request.endpoint and request.endpoint.startswith('manager.venue') }}"
               href="{{ url_for('manager.venue_list') }}">場地與器材</a>
        </div>
    </nav>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="notice {{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
        <footer>校園場館借用系統 · 所有預約時間均為台北時間（UTC+8）</footer>
    </main>
</body>
</html>
